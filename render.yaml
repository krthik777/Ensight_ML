services:
  - type: web
    name: ensight-ml-backend
    runtime: python
    plan: standard
    region: singapore

    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers=1 --worker-class=sync --timeout=120 --preload --bind=0.0.0.0:$PORT

    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # ⚠️  IMPORTANT: The full Atlas URI must include the database name
      # and connection options — set this exact string in Render dashboard
      # under Environment → MONGO_URI (mark as Secret)
      #
      # Format:
      #   mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/<dbName>?retryWrites=true&w=majority
      #
      - key: MONGO_URI
        sync: false    # Secret — set manually in Render dashboard, never commit credentials

      - key: MONGO_DB
        value: energydashboard

      - key: PYTHON_VERSION
        value: "3.11.0"
